[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar-selected-modules"
version = "1.0.0"
description = "Selected modules from Job Radar. Viewing only."
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Ievgen Akhrimienko" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
